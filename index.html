<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Routine Notebook</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="app.js"></script>
</head>
<body>
  <header class="mast">
    <div><span class="binding" aria-hidden="true"></span><strong>Routine Notebook</strong></div>
    <span>Saved on this device</span>
  </header>
  <main>
    <section class="intro">
      <div>
        <h1>One day at a time.</h1>
        <p>Record how your skin felt and what you used. Return to your notes when you want to see what changed.</p>
      </div>
      <figure aria-hidden="true"><i></i><i></i><i></i><i></i></figure>
    </section>
    <div class="notebook">
      <section class="entry" aria-labelledby="entry-heading">
        <h2 id="entry-heading">Daily entry</h2>
        <form id="entry-form">
          <label for="date">Date</label>
          <input id="date" type="date" required>
          <fieldset>
            <legend>How did your skin feel?</legend>
            <div class="choices">
              <label><input type="radio" name="feeling" value="Tight" required><span>Tight</span></label>
              <label><input type="radio" name="feeling" value="Comfortable"><span>Comfortable</span></label>
              <label><input type="radio" name="feeling" value="Oily"><span>Oily</span></label>
              <label><input type="radio" name="feeling" value="Mixed"><span>Mixed</span></label>
            </div>
          </fieldset>
          <label for="products">Products used</label>
          <input id="products" placeholder="For example, cleanser and moisturizer" maxlength="160">
          <label for="notes">Notes</label>
          <textarea id="notes" rows="4" maxlength="1200" placeholder="What was different today?"></textarea>
          <button type="submit">Save entry</button>
        </form>
      </section>
      <section class="history" aria-labelledby="history-heading">
        <div class="history-head">
          <div><h2 id="history-heading">Your entries</h2><p id="summary"></p></div>
          <button id="export" type="button" class="plain">Export JSON</button>
        </div>
        <ol id="entries"></ol>
      </section>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <footer>A private journal for personal observations.</footer>
</body>
</html>
